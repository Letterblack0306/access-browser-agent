<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live AI Agent Execution Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-base: #1e1e1e;
      --bg-surface: #252526;
      --bg-editor: #1e1e1e;
      --border-color: #3c3c3c;
      --text-main: #d4d4d4;
      --text-muted: #858585;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --font-mono: 'Fira Code', 'Consolas', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #555; transition: background 0.3s, box-shadow 0.3s; }
    .status-indicator.thinking { background: var(--accent-purple); box-shadow: 0 0 8px var(--accent-purple); }
    .status-indicator.reading { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
    .status-indicator.tool_calling { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber); }
    .status-indicator.writing { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .status-indicator.idle { background: #555; }
    .cursor { display: inline-block; width: 8px; height: 1.2em; background: var(--accent-green); vertical-align: middle; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body class="flex flex-col">
  <!-- Status Bar / Header -->
  <header class="h-10 bg-[#333333] border-b border-[#3c3c3c] flex items-center justify-between px-4">
    <div class="flex items-center gap-3">
      <div id="indicator" class="status-indicator idle"></div>
      <span id="statusLabel" class="text-xs font-bold uppercase tracking-wider">Idle</span>
    </div>
    <div class="flex items-center gap-3">
      <select id="model-select" class="bg-[#1e1e1e] text-xs border border-[#3c3c3c] rounded px-2 py-1 text-[#d4d4d4]">
        <option>Loading Models...</option>
      </select>
      <button id="btn-start" class="bg-[#0e639c] hover:bg-[#1177bb] text-white text-xs px-3 py-1 rounded">▶ Start Agent</button>
      <button id="btn-stop" class="bg-[#a1260d] hover:bg-[#c42b1c] text-white text-xs px-3 py-1 rounded hidden">■ Stop</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Editor / Code Streamer -->
    <div class="flex-1 bg-[#1e1e1e] overflow-auto p-4 font-mono text-sm relative">
      <div class="text-xs text-[#858585] mb-2">Agent Intent: <span id="actionSummary" class="text-[#d4d4d4]">Waiting for task start...</span></div>
      <pre id="codeStream" class="whitespace-pre-wrap"></pre><span id="cursor" class="cursor" style="display:none;"></span>
    </div>
  </main>

  <!-- Terminal / Bottom Log Panel -->
  <footer class="h-1/3 bg-[#1e1e1e] border-t border-[#3c3c3c] flex flex-col">
    <div class="h-8 border-b border-[#3c3c3c] flex items-center px-4 text-xs text-[#858585] font-bold uppercase">
      Execution Log
    </div>
    <div id="logPanel" class="flex-1 overflow-auto p-2 font-mono text-xs space-y-1"></div>
  </footer>

  <script>
    // Backend Connection: window.accessAgentRuntime
    const $ = (id) => document.getElementById(id);

    async function init() {
      // Load models
      try {
        const models = await window.accessAgentRuntime.getModels();
        const select = $('model-select');
        if (models && models.length > 0) {
          select.innerHTML = '';
          models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id || m.name;
            opt.textContent = m.name || m.id;
            select.appendChild(opt);
          });
        }
      } catch (e) { console.error('Model Load Error', e); }

      $('btn-start').onclick = async () => {
        $('btn-start').classList.add('hidden');
        $('btn-stop').classList.remove('hidden');
        try {
          await window.accessAgentRuntime.start({ model: $('model-select').value });
        } catch (e) {
          console.error('Start Error', e);
          $('btn-start').classList.remove('hidden');
          $('btn-stop').classList.add('hidden');
        }
      };

      $('btn-stop').onclick = async () => {
        $('btn-start').classList.remove('hidden');
        $('btn-stop').classList.add('hidden');
        await window.accessAgentRuntime.stop();
      };

      // Poll status
      setInterval(async () => {
        try {
          const status = await window.accessAgentRuntime.getStatus();
          updateStatus(status.state.status);
        } catch (e) {}
      }, 5000);
    }

    function updateStatus(status) {
      const label = $('statusLabel');
      const indicator = $('indicator');
      label.textContent = status.toUpperCase();
      indicator.className = `status-indicator ${status}`;
      $('actionSummary').textContent = status === 'running' ? 'Agent is actively processing...' : 'Waiting for task start...';
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
<script src="./preload.js"></script></body>
</html>
